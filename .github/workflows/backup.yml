name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: SSH into DB server, backup and notify
        id: backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DISCORD_WEBHOOK_URL
          script: |
            set +e
            mkdir -p /var/backups/plantpartner
            mysqldump -u root plantpartner 2>/dev/null > /var/backups/plantpartner/backup_$(date +%Y%m%d_%H%M%S).sql
            ls -t /var/backups/plantpartner/*.sql | tail -n +8 | xargs rm -f

            PLANTS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Plants;" 2>/dev/null)
            USERS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Users;" 2>/dev/null)
            SUBS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM push_subscriptions;" 2>/dev/null)
            BACKUP_SIZE=$(du -sh /var/backups/plantpartner/$(ls -t /var/backups/plantpartner/ | head -1) | cut -f1)

            curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Database Backup Complete\",
                \"description\": \"plantpartner DB backed up successfully\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Plants\", \"value\": \"$PLANTS\", \"inline\": true},
                  {\"name\": \"Users\", \"value\": \"$USERS\", \"inline\": true},
                  {\"name\": \"Push Subscriptions\", \"value\": \"$SUBS\", \"inline\": true},
                  {\"name\": \"Backup Size\", \"value\": \"$BACKUP_SIZE\", \"inline\": true},
                  {\"name\": \"Retention\", \"value\": \"Last 7 days kept\", \"inline\": true}
                ]
              }]
            }" \
            $DISCORD_WEBHOOK_URL

      - name: Notify Discord — Backup Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🚨 Database Backup Failed",
              "description": "Check the Actions tab immediately",
              "color": 15158332
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
