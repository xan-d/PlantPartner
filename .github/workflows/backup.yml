name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: SSH into DB server, backup and notify
        id: backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set +e
            mkdir -p /var/backups/plantpartner
            mysqldump -u root plantpartner 2>/dev/null > /var/backups/plantpartner/backup_$(date +%Y%m%d_%H%M%S).sql
            ls -t /var/backups/plantpartner/*.sql | tail -n +8 | xargs rm -f

            # counts
            PLANTS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Plants;" 2>/dev/null)
            USERS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Users;" 2>/dev/null)
            SUBS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM push_subscriptions;" 2>/dev/null)
            SESSIONS=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM sessions;" 2>/dev/null)

            # plant health breakdown
            HAPPY=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Plants WHERE health='happy';" 2>/dev/null)
            OKAY=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Plants WHERE health='okay';" 2>/dev/null)
            UNHAPPY=$(mysql -u root -N plantpartner -se "SELECT COUNT(*) FROM Plants WHERE health='unhappy';" 2>/dev/null)

            # most thirsty plant
            THIRSTIEST=$(mysql -u root -N plantpartner -se "SELECT name FROM Plants ORDER BY (lastWatered - waterFreq) ASC LIMIT 1;" 2>/dev/null)

            # newest user
            NEWEST_USER=$(mysql -u root -N plantpartner -se "SELECT displayName FROM Users ORDER BY createdAt DESC LIMIT 1;" 2>/dev/null)

            # backup size
            BACKUP_SIZE=$(du -sh /var/backups/plantpartner/$(ls -t /var/backups/plantpartner/ | head -1) | awk '{print $1}')
            BACKUP_COUNT=$(ls /var/backups/plantpartner/*.sql | wc -l)
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')

            curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🌿 Nightly Backup\",
                \"description\": \"Backup completed successfully at $TIMESTAMP\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"📦 Backup Size\", \"value\": \"$BACKUP_SIZE\", \"inline\": true},
                  {\"name\": \"🗂️ Backups Stored\", \"value\": \"$BACKUP_COUNT / 7\", \"inline\": true},
                  {\"name\": \"\u200b\", \"value\": \"\u200b\", \"inline\": true},
                  {\"name\": \"🌱 Plants\", \"value\": \"$PLANTS total\", \"inline\": true},
                  {\"name\": \"❤️ Health\", \"value\": \"$HAPPY happy · $OKAY okay · $UNHAPPY unhappy\", \"inline\": true},
                  {\"name\": \"💧 Thirstiest\", \"value\": \"$THIRSTIEST\", \"inline\": true},
                  {\"name\": \"👤 Users\", \"value\": \"$USERS\", \"inline\": true},
                  {\"name\": \"🔔 Push Subs\", \"value\": \"$SUBS\", \"inline\": true},
                  {\"name\": \"🟢 Sessions\", \"value\": \"$SESSIONS active\", \"inline\": true},
                  {\"name\": \"🆕 Newest User\", \"value\": \"$NEWEST_USER\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"Retention: last 7 days · Next backup in ~24h\"}
              }]
            }" \
            https://discord.com/api/webhooks/1481185788602355736/pD2-AAXMZvGNulyNzDDeAZqnEYvpGg2o55z5Uf1rNHJ1tX6nNXf2r22n15iprrRKB8Aq

      - name: Notify Discord — Backup Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🚨 Database Backup Failed",
              "description": "Something went wrong — check the Actions tab immediately",
              "color": 15158332,
              "footer": {"text": "PlantPartner · Nightly Backup"}
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
