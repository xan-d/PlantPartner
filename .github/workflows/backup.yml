name: Database Backup

on:
  schedule:
    - cron: '55 10 * * *'  # daily at 3:55 AM PDT
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: SSH into DB server, backup and notify
        id: backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DB_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # exit on any error

            DB_USER="${{ secrets.DB_USER }}"
            DB_PASS="${{ secrets.DB_PASS }}"

            mkdir -p /var/backups/plantpartner
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="/var/backups/plantpartner/backup_$TIMESTAMP.sql"

            # MySQL dump
            mysqldump -u "$DB_USER" -p"$DB_PASS" plantpartner > "$BACKUP_FILE"

            # Keep only last 7 backups
            ls -t /var/backups/plantpartner/*.sql | tail -n +8 | xargs rm -f

            # --- Fetch counts ---
            PLANTS=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM Plants;")
            USERS=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM Users;")
            SUBS=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM push_subscriptions;")
            SESSIONS=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM sessions;")

            # Health breakdown
            HAPPY=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM Plants WHERE health='happy';")
            OKAY=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM Plants WHERE health='okay';")
            UNHAPPY=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "SELECT COUNT(*) FROM Plants WHERE health='unhappy';")

            # Most thirsty plant
            THIRSTIEST=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "
              SELECT name
              FROM Plants
              ORDER BY (DATEDIFF(CURDATE(), lastWatered) - waterFreq) DESC
              LIMIT 1;
            ")

            # Newest user
            NEWEST_USER=$(mysql -u "$DB_USER" -p"$DB_PASS" -N plantpartner -se "
              SELECT displayName
              FROM Users
              ORDER BY createdAt DESC
              LIMIT 1;
            ")

            # Backup info
            BACKUP_SIZE=$(du -sh "$BACKUP_FILE" | awk '{print $1}')
            BACKUP_COUNT=$(ls /var/backups/plantpartner/*.sql | wc -l)
            BACKUP_TIMESTAMP=$(date '+%Y-%m-%d %H:%M UTC')

            # --- Notify Discord ---
            curl -H "Content-Type: application/json" \
              -d "{
                \"embeds\": [{
                  \"title\": \"🌿 Nightly Backup\",
                  \"description\": \"Backup completed successfully at $BACKUP_TIMESTAMP\",
                  \"color\": 3066993,
                  \"fields\": [
                    {\"name\": \"📦 Backup Size\", \"value\": \"$BACKUP_SIZE\", \"inline\": true},
                    {\"name\": \"🗂️ Backups Stored\", \"value\": \"$BACKUP_COUNT / 7\", \"inline\": true},
                    {\"name\": \"\u200b\", \"value\": \"\u200b\", \"inline\": true},
                    {\"name\": \"🌱 Plants\", \"value\": \"$PLANTS total\", \"inline\": true},
                    {\"name\": \"❤️ Health\", \"value\": \"$HAPPY happy · $OKAY okay · $UNHAPPY unhappy\", \"inline\": true},
                    {\"name\": \"💧 Thirstiest\", \"value\": \"$THIRSTIEST\", \"inline\": true},
                    {\"name\": \"👤 Users\", \"value\": \"$USERS\", \"inline\": true},
                    {\"name\": \"🔔 Push Subs\", \"value\": \"$SUBS\", \"inline\": true},
                    {\"name\": \"🟢 Sessions\", \"value\": \"$SESSIONS active\", \"inline\": true},
                    {\"name\": \"🆕 Newest User\", \"value\": \"$NEWEST_USER\", \"inline\": true}
                  ],
                  \"footer\": {\"text\": \"Retention: last 7 days · Next backup in ~24h\"}
                }]
              }" \
              ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord — Backup Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚨 Database Backup Failed",
                "description": "Something went wrong — check the Actions tab immediately",
                "color": 15158332,
                "footer": {"text": "PlantPartner · Nightly Backup"}
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}