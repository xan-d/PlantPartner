name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_ENV,FRONTEND_ENV
          script: |
            cd /var/www/myapp

            # Write production env files
            echo "$BACKEND_ENV" > backend/.env
            echo "$FRONTEND_ENV" > frontend/.env

            # Swap config.js to production mode
            sed -i 's|const API_URL = import.meta.env.VITE_API_URL.*|const API_URL = "";|' frontend/src/config.js

            git pull origin main

            npm install --prefix backend
            npm run build --prefix frontend
            pm2 restart plantpartner