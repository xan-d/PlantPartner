# Need to work this time please
name: Deploy to Homelab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USER }}
                key: ${{ secrets.SSH_PRIVATE_KEY }}
                script: |
                  cd /var/www/myapp
                  git pull origin main
                  
                  # 1. Install dependencies
                  npm install --prefix backend
                  npm install --prefix frontend

                  # 2. Build the frontend using the server's .env
                  # This assumes you have a .env file already sitting in /var/www/myapp/frontend/
                  npm run build --prefix frontend

                  # 3. Restart the backend
                  pm2 restart plantpartner

      - name: Notify Discord — Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "PlantPartner Deployed",
              "description": "New version is live on plant-partner.com",
              "color": 3066993,
              "fields": [
                {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                {"name": "Pushed by", "value": "${{ github.actor }}", "inline": true}
              ]
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord — Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "PlantPartner Deploy Failed",
              "description": "Something went wrong — check the Actions tab",
              "color": 15158332,
              "fields": [
                {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                {"name": "Pushed by", "value": "${{ github.actor }}", "inline": true}
              ]
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
